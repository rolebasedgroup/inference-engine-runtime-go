name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "not gofmt-formatted:"; echo "$files"; exit 1
          fi
      - name: Vet
        run: go vet ./... && go vet -tags integration ./test/integration/...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./... ./examples/custom-runtime

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.34.x -p path)" >> "$GITHUB_ENV"
      - name: Integration tests
        run: go test -tags integration -timeout 10m ./test/integration/...
