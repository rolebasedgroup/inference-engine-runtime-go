# Test-only CRD fixture for the RoleInstance lifecycle-hook protocol.
#
# The fixture mirrors the wire format proposed in KEP-527 (sgl-project/rbg
# PR #546). It exists so the experimental source/rbg adapter can be tested
# against a real API server. Passing these tests does NOT mean the source is
# compatible with a real RBG cluster: no released controller implements this
# protocol yet.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: roleinstances.workloads.x-k8s.io
spec:
  group: workloads.x-k8s.io
  names:
    kind: RoleInstance
    listKind: RoleInstanceList
    plural: roleinstances
    singular: roleinstance
  scope: Namespaced
  versions:
    - name: v1alpha2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                lifecycle:
                  type: object
                  properties:
                    preUpdate:
                      type: object
                      properties:
                        signalLabels:
                          type: object
                          additionalProperties:
                            type: string
                    preRecover:
                      type: object
                      properties:
                        signalLabels:
                          type: object
                          additionalProperties:
                            type: string
                    postReady:
                      type: object
                      properties:
                        signalLabels:
                          type: object
                          additionalProperties:
                            type: string
                    preDelete:
                      type: object
                      properties:
                        signalLabels:
                          type: object
                          additionalProperties:
                            type: string
      subresources:
        status: {}
